name: Deploy to Hostinger

# Triggers:
#   push to main → automatic deploy of whatever was just merged
#   workflow_dispatch → manual deploy from the Actions tab (handy for re-runs)
on:
  push:
    branches: [main]
  workflow_dispatch:

# The bot needs to push to the ui-build branch. Default GITHUB_TOKEN is
# read-only, which is why earlier runs failed with HTTP 403.
permissions:
  contents: write

# Don't let two deploys race each other. If a second push lands while one is
# running, the second waits — we don't cancel mid-deploy because Laravel
# config:cache + composer install aren't safe to interrupt halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Frontend & Trigger Webhook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Push Build Artifacts to Branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Use a separate worktree for the orphan branch so node_modules/
          # from the build step never gets staged. The previous "git rm -rf ."
          # + "git add -A" pattern wiped .gitignore and then picked up
          # node_modules — committing 4700+ files per deploy.
          git fetch origin ui-build || true
          git worktree add --orphan -B ui-build ../ui-build-tree

          # Wipe whatever was on the branch before
          rm -rf ../ui-build-tree/* ../ui-build-tree/.[!.]* 2>/dev/null || true

          # Copy ONLY the compiled build output
          cp -r dist/. ../ui-build-tree/

          cd ../ui-build-tree
          git add -A
          git commit --allow-empty -m "Deploy UI build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin ui-build

      - name: Hit Deployment Webhook (Backend via Pull)
        run: |
          HEALTH=$(curl -fsS --max-time 300 "https://api.destinocojp.com/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}" || true)
          echo "$HEALTH"
          
          # Check health
          echo "==> Post-Deploy Health check"
          CHECK=$(curl -fsS --max-time 10 https://api.destinocojp.com/api/v1/health || true)
          if [[ "$CHECK" != *'"status":"ok"'* ]]; then
            echo "ERROR: API health check failed. Response was:"
            echo "$CHECK"
            exit 1
          fi
          echo "API health: $CHECK"
