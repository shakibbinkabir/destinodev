name: Deploy to Hostinger

# Triggers:
#   push to main → automatic deploy of whatever was just merged
#   workflow_dispatch → manual deploy from the Actions tab (handy for re-runs)
on:
  push:
    branches: [main]
  workflow_dispatch:

# The bot needs to push to the ui-build branch. Default GITHUB_TOKEN is
# read-only, which is why earlier runs failed with HTTP 403.
permissions:
  contents: write

# Don't let two deploys race each other. If a second push lands while one is
# running, the second waits — we don't cancel mid-deploy because Laravel
# config:cache + composer install aren't safe to interrupt halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Frontend & Trigger Webhook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Push Build Artifacts to Branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          # Stash the compiled assets outside the repo so we can safely wipe
          # the working tree without losing them.
          DIST_TMP=$(mktemp -d)
          cp -r dist/. "$DIST_TMP/"

          # Switch to a fresh orphan branch in-place. (We tried
          # `git worktree add --orphan -B` first, but git 2.53 on the runner
          # fails mid-setup with "fatal: not a git repository" — the worktree
          # directory gets registered but the .git link file doesn't get
          # written before subsequent commands try to use it.)
          git checkout --orphan ui-build
          git rm -rf --cached . 2>/dev/null || true

          # Wipe every file in the working tree except .git so node_modules,
          # source code, and config files don't end up on the ui-build branch.
          # Without this, "git add -A" would stage 4700+ files per deploy.
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +

          # Restore just the compiled assets
          cp -r "$DIST_TMP/." .

          git add -A
          git commit --allow-empty -m "Deploy UI build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f origin ui-build

      - name: Hit Deployment Webhook (Backend via Pull)
        run: |
          HEALTH=$(curl -fsS --max-time 300 "https://api.destinocojp.com/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}" || true)
          echo "$HEALTH"
          
          # Check health
          echo "==> Post-Deploy Health check"
          CHECK=$(curl -fsS --max-time 10 https://api.destinocojp.com/api/v1/health || true)
          if [[ "$CHECK" != *'"status":"ok"'* ]]; then
            echo "ERROR: API health check failed. Response was:"
            echo "$CHECK"
            exit 1
          fi
          echo "API health: $CHECK"
