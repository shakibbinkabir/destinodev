name: Deploy to Hostinger

# Triggers:
#   push to main → automatic deploy of whatever was just merged
#   workflow_dispatch → manual deploy from the Actions tab (handy for re-runs)
on:
  push:
    branches: [main]
  workflow_dispatch:

# Don't let two deploys race each other. If a second push lands while one is
# running, the second waits — we don't cancel mid-deploy because Laravel
# config:cache + composer install aren't safe to interrupt halfway.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build Frontend & Trigger Webhook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Frontend
        run: |
          npm ci
          npm run build

      - name: Push Build Artifacts to Branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          # Switch to an orphan branch so we only push the dist folder
          git checkout --orphan ui-build
          git rm -rf .
          # Move dist contents to root and commit them
          mv dist/* ./
          git add -A
          git commit -m "Deploy UI build to ui-build branch"
          git push origin ui-build --force

      - name: Hit Deployment Webhook (Backend via Pull)
        run: |
          HEALTH=$(curl -fsS --max-time 300 "https://api.destinocojp.com/deploy.php?token=${{ secrets.DEPLOY_TOKEN }}" || true)
          echo "$HEALTH"
          
          # Check health
          echo "==> Post-Deploy Health check"
          CHECK=$(curl -fsS --max-time 10 https://api.destinocojp.com/api/v1/health || true)
          if [[ "$CHECK" != *'"status":"ok"'* ]]; then
            echo "ERROR: API health check failed. Response was:"
            echo "$CHECK"
            exit 1
          fi
          echo "API health: $CHECK"
